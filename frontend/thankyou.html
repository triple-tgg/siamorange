<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับการสั่งซื้อ - Siam Orange</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/public/img/favicon.ico">
  <style>
    body {
      background: linear-gradient(135deg, #fffdfa 0%, #ffe5b4 100%);
      font-family: 'Prompt', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thankyou-container {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(255, 165, 0, 0.10);
      max-width: 400px;
      width: 100%;
      padding: 36px 28px 32px 28px;
      text-align: center;
      border: 2.5px solid #ffa500;
    }
    .thankyou-container img {
      width: 90px;
      margin-bottom: 18px;
      border-radius: 50%;
      box-shadow: 0 2px 8px #ffe5b4;
    }
    h1 {
      color: #e67e22;
      font-size: 2.1rem;
      margin: 0 0 10px 0;
      font-weight: 700;
    }
    p {
      color: #333;
      font-size: 1.1rem;
      margin: 0 0 18px 0;
    }
    .order-info {
      background: #fffdfa;
      border-radius: 10px;
      padding: 12px 0;
      margin: 18px 0 0 0;
      color: #d35400;
      font-weight: 500;
      font-size: 1.1rem;
    }
    .btn-home {
      display: inline-block;
      margin-top: 24px;
      background: #ffa500;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      text-decoration: none;
      box-shadow: 0 2px 8px #ffe5b4;
      transition: background 0.2s;
      cursor: pointer;
    }
    .btn-home:hover {
      background: #e67e22;
    }
    @media (max-width: 500px) {
      .thankyou-container { padding: 24px 6vw; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <img src="/public/img/img_android-chrome-192x192.png" alt="Siam Orange Logo">
    <h1>ขอบคุณสำหรับการสั่งซื้อ!</h1>
    <p>คำสั่งซื้อของคุณได้รับเรียบร้อยแล้ว<br>ทีมงานจะดำเนินการจัดส่งสินค้าโดยเร็วที่สุด</p>
    <div class="order-info">
      🍊 “สยามออเร้นจ์” น้ำส้มคุณภาพ ณ ตลาดวังหลัง<br>
      สดใหม่ ส่งตรงถึงมือคุณ
    </div>
  <a href="index.html" class="btn-home">สั่งซื้ออีกครั้ง</a>
  </div>
</body>
</html>
